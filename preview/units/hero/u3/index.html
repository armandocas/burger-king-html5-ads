<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="ad.size" content="width=728,height=90" />
    <title>Burger King | en-US | 728x90</title>
    <script>
      var clickTag = "https://www.bk.com/";
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="ad ad--728x90" aria-label="Burger King concept ad: when hunger calls">
      <span class="swoosh" aria-hidden="true"></span>
      <img class="brand" src="logo.svg" alt="Burger King" draggable="false" />
      <div class="copy">
        <h1>When hunger<br />calls.</h1>
        <p>Answer with flavor.</p>
        <div class="cta">Order now <span aria-hidden="true">↗</span></div>
      </div>
      <img
        class="burger"
        src="burger.png"
        width="120"
        height="120"
        alt=""
        draggable="false"
      />
      <a
        class="ad-click"
        href="javascript:window.open(window.clickTag)"
        aria-label="Order now"
      ></a>
    </main>
    <script src="ad.js"></script>
  </body>
</html>
