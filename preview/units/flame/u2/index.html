<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="ad.size" content="width=160,height=600" />
    <title>Burger King | en-US | 160x600</title>
    <script>
      var clickTag = "https://www.bk.com/";
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="ad ad--160x600" aria-label="Burger King concept ad: worth the craving">
      <span class="swoosh" aria-hidden="true"></span>
      <img class="brand" src="logo.svg" alt="Burger King" draggable="false" />
      <div class="copy">
        <h1>Worth the<br />craving.</h1>
        <p>Flame-grilled flavor.</p>
        <div class="cta">Explore menu <span aria-hidden="true">↗</span></div>
      </div>
      <img
        class="burger"
        src="burger.png"
        width="230"
        height="230"
        alt=""
        draggable="false"
      />
      <a
        class="ad-click"
        href="javascript:window.open(window.clickTag)"
        aria-label="Explore menu"
      ></a>
    </main>
    <script src="ad.js"></script>
  </body>
</html>
